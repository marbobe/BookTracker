<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header::header-section(title='Register')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navigation::navigation-section}"></div>

<main class="content-wrapper d-flex align-items-center py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Create Account</h2>

                    <form th:action="@{/register}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Choose Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-plus text-primary"></i></span>
                                <input type="text" th:field="*{username}" class="form-control" placeholder="New username" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label font-weight-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-lock text-primary"></i></span>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Secure password" required>
                            </div>
                        </div>

                        <div th:if="${error}" class="alert alert-warning d-flex align-items-center">
                            <i class="bi bi-exclamation-circle-fill me-2"></i>
                            <span th:text="${error}"></span>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Create Account</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Already have an account?</p>
                        <a href="/login" class="text-primary fw-bold text-decoration-none">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments/footer::footer-section}"></div>
</body>
</html>
