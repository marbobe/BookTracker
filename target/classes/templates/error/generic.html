<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header::header-section(title='Unexpected Error')}"></head>
<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 text-center p-5" style="max-width: 550px; border-radius: 20px;">
        <div class="card-body">
            <div class="mb-4 text-danger">
                <i class="bi bi-exclamation-triangle display-1"></i>
            </div>

            <h1 class="display-4 fw-bold text-dark mb-2">Something went wrong</h1>
            <h4 class="text-muted mb-4">Internal Server Error</h4>

            <div class="p-3 bg-light rounded-3 mb-5 border">
                <code class="text-wrap small" th:text="${errorMessage}">
                    Error details will appear here.
                </code>
            </div>

            <div class="d-grid">
                <a th:href="@{/index}" class="btn btn-dark btn-lg rounded-pill fw-bold shadow-sm">
                    <i class="bi bi-arrow-left me-2"></i>Return to Homepage
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer::footer-section}"></div>
</body>
</html>
