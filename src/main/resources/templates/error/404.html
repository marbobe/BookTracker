<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header::header-section(title='Page Not Found')}"></head>
<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 text-center p-5" style="max-width: 550px; border-radius: 20px;">
        <div class="card-body">
            <div class="mb-4">
                <i class="bi bi-search display-1 text-muted opacity-25"></i>
            </div>

            <h1 class="display-1 fw-bold text-primary mb-2">404</h1>
            <h2 class="fw-bold text-dark mb-3">Oops! Book Not Found</h2>

            <p class="text-muted mb-5 fs-5" th:text="${errorMessage}">
                The resource you are looking for might have been removed or is temporarily unavailable.
            </p>

            <div class="d-grid gap-2">
                <a th:href="@{/index}" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm">
                    <i class="bi bi-house-door me-2"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer::footer-section}"></div>
</body>
</html>
