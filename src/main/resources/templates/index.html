<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/header::header-section(title='My Library')}"></head>
<body>

<div th:with="filtersActive=${(title != null and !#strings.isEmpty(title)) or
                          (author != null and !#strings.isEmpty(author)) or
                          (finishDate != null) or
                          (score != null)}">

    <div th:replace="~{fragments/navigation::navigation-section}"></div>

    <div class="container my-5">
        <div class="card shadow border-0" style="border-radius: 15px; overflow: hidden;">
            <div class="card-body p-4">
                <h3 class="mb-4 text-center fw-bold text-dark">Your Books</h3>

                <div class="text-center mb-4">
                    <button th:if="${!filtersActive}"
                            class="btn btn-outline-primary rounded-pill px-4"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#filterForm">
                        <i class="bi bi-filter"></i> Filter Books
                    </button>

                    <a th:if="${filtersActive}"
                       th:href="@{/index/clear}"
                       class="btn btn-outline-danger rounded-pill px-4">
                        <i class="bi bi-x-circle"></i> Clear Filters
                    </a>
                </div>

                <div class="collapse mb-4" id="filterForm" th:classappend="${filtersActive} ? ' show'">
                    <form th:action="@{/index}" method="get" class="row g-3 p-3 bg-light rounded shadow-sm">
                        <div class="col-md-3"><input type="text" class="form-control" name="title" placeholder="Title" th:value="${title}"></div>
                        <div class="col-md-3"><input type="text" class="form-control" name="author" placeholder="Author" th:value="${author}"></div>
                        <div class="col-md-2"><input type="date" class="form-control" name="finishDate" th:value="${finishDate}"></div>
                        <div class="col-md-2"><input type="number" min="1" max="5" class="form-control" name="score" placeholder="Score" th:value="${score}"></div>
                        <div class="col-md-2"><button type="submit" class="btn btn-primary w-100 rounded-pill">Apply</button></div>
                    </form>
                </div>

                <div th:if="${demoMessage}" class="alert alert-info alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <span th:text="${demoMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle text-center">
                        <thead class="bg-gradient-primary text-black" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <tr>
                            <th scope="col" class="py-3">ID</th>

                            <th scope="col" class="py-3 sortable-header">
                                <a th:href="@{/index(page=0, size=${bookPage.size}, sortField='title', sortDir=${reverseSortDir}, title=${title}, author=${author}, finishDate=${finishDate}, score=${score})}"
                                   class="text-black text-decoration-none d-block">
                                    Title <i th:if="${sortField == 'title'}" th:classappend="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                                </a>
                            </th>

                            <th scope="col" class="py-3 sortable-header">
                                <a th:href="@{/index(page=0, size=${bookPage.size}, sortField='author', sortDir=${sortField == 'author' ? reverseSortDir : 'asc'}, title=${title}, author=${author}, finishDate=${finishDate}, score=${score})}"
                                   class="text-black text-decoration-none d-block">
                                    Author <i th:if="${sortField == 'author'}" th:classappend="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                                </a>
                            </th>

                            <th scope="col" class="py-3">Genre</th>

                            <th scope="col" class="py-3 sortable-header">
                                <a th:href="@{/index(page=0, size=${bookPage.size}, sortField='finishDate', sortDir=${sortField == 'finishDate' ? reverseSortDir : 'asc'}, title=${title}, author=${author}, finishDate=${finishDate}, score=${score})}"
                                   class="text-black text-decoration-none d-block">
                                    Finish Date <i th:if="${sortField == 'finishDate'}" th:classappend="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                                </a>
                            </th>

                            <th scope="col" class="py-3 sortable-header">
                                <a th:href="@{/index(page=0, size=${bookPage.size}, sortField='score', sortDir=${sortField == 'score' ? reverseSortDir : 'asc'}, title=${title}, author=${author}, finishDate=${finishDate}, score=${score})}"
                                   class="text-black text-decoration-none d-block">
                                    Score <i th:if="${sortField == 'score'}" th:classappend="${sortDir == 'asc'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down'"></i>
                                </a>
                            </th>

                            <th scope="col" class="py-3">Review</th>
                            <th scope="col" class="py-3">Actions</th>
                        </tr>
                        </thead>

                        <tbody class="bg-white">
                        <tr th:each="book : ${bookPage.content}">
                            <td th:text="${book.idBook}" class="fw-bold text-muted"></td>
                            <td th:text="${book.title}" class="fw-semibold"></td>
                            <td th:text="${book.author}"></td>
                            <td><span class="badge bg-light text-dark fw-normal border" th:text="${book.genre}"></span></td>
                            <td th:text="${book.finishDate}"></td>

                            <td>
                                <span th:each="i : ${#numbers.sequence(1, 5)}"
                                      th:classappend="${i <= (book.score != null ? book.score : 0)} ? 'star' : 'text-muted'">★</span>
                            </td>

                            <td class="text-truncate" style="max-width: 150px;" th:text="${book.review}"></td>

                            <td class="text-end" sec:authorize="isAuthenticated()">
                                <div th:if="${#authentication.name != 'guest'}" class="d-flex justify-content-center gap-2">
                                    <a th:href="@{/index/edit/{idBook}(idBook=${book.idBook})}"
                                       class="btn btn-action btn-outline-edit">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>

                                    <a th:href="@{/index/delete/{idBook}(idBook=${book.idBook})}"
                                       class="btn btn-action btn-outline-delete"
                                       onclick="return confirm('Are you sure you want to delete this book?')">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </div>
                                <div th:if="${#authentication.name == 'guest'}">
                                    <span class="badge bg-light text-muted">Read Only</span>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${bookPage.totalElements == 0}">
                            <td colspan="8" class="py-5 text-muted italic">No books found in your collection.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <nav th:if="${bookPage.totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${bookPage.first}? 'disabled'">
                            <a class="page-link shadow-sm"
                               th:href="@{/index(page=${bookPage.number - 1}, size=${bookPage.size}, sortField=${sortField}, sortDir=${sortDir}, title=${title}, author=${author}, finishDate=${finishDate}, score=${score})}">
                                Previous
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, bookPage.totalPages - 1)}" th:classappend="${i == bookPage.number}? 'active'">
                            <a class="page-link shadow-sm"
                               th:href="@{/index(page=${i}, size=${bookPage.size}, sortField=${sortField}, sortDir=${sortDir}, title=${title}, author=${author}, finishDate=${finishDate}, score=${score})}"
                               th:text="${i + 1}">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${bookPage.last}? 'disabled'">
                            <a class="page-link shadow-sm"
                               th:href="@{/index(page=${bookPage.number + 1}, size=${bookPage.size}, sortField=${sortField}, sortDir=${sortDir}, title=${title}, author=${author}, finishDate=${finishDate}, score=${score})}">
                                Next
                            </a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer::footer-section}"></div>

</body>
</html>
